name: Deploy to GitHub Pages

# 그림일기 단어 전투 — TypeScript/Vite 빌드를 GitHub Pages로 배포한다.
# Settings > Pages > Source = "GitHub Actions"로 설정하면 이 워크플로가 게시한다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Reproducible install
        run: npm ci
      - name: Quality gate
        run: npm test
      - name: Build public demo
        run: npm run build:demo
        env:
          GITHUB_PAGES: '1'
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist-demo

  # Pages 환경 보호 규칙이 main만 게시를 허용하므로, 배포는 main에서만 실행한다.
  # (기능 브랜치 푸시는 build/type-check까지만 돌고 배포는 건너뛴다 → 거부 오류 방지.)
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
