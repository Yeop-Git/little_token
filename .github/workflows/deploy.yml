name: Deploy to GitHub Pages

# 그림일기 단어 전투 — TypeScript/Vite 빌드를 GitHub Pages로 배포한다.
# Settings > Pages > Source = "GitHub Actions"로 설정하면 이 워크플로가 게시한다.

on:
  push:
    branches: [main, claude/diary-word-battle-game-cuhivh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pages 환경 보호 규칙이 main만 게시를 허용하므로, 배포는 main에서만 실행한다.
  # (기능 브랜치 푸시는 build/type-check까지만 돌고 배포는 건너뛴다 → 거부 오류 방지.)
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
